<style>
:root {
  --page: #f4efec;
  --card: #ffffff;
  --ink: #221d1a;
  --ink-2: #6f655e;
  --hairline: #e5dcd6;
  --accent: #7a4a21;
  --accent-ink: #ffffff;
  --chip: #f7f1ec;
  --chip-on: #7a4a21;
  --chip-on-ink: #ffffff;
  --note-bg: #faf3e7;
  --note-line: #e8d5b5;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Kufi Arabic", "Cairo", Tahoma, Arial, sans-serif;
  line-height: 1.6;
  min-height: 100vh;
}
.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: 20px 14px 48px;
}
.card {
  background: var(--card);
  border: 1px solid var(--hairline);
  border-radius: 20px;
  padding: 22px 18px;
  box-shadow: 0 1px 3px rgba(34, 29, 26, 0.05);
}
.sb-head { text-align: center; display: grid; gap: 8px; justify-items: center; margin-bottom: 8px; }
.sb-head img { width: 120px; height: auto; }
.sb-head h1 { font-weight: 600; font-size: 25px; margin: 4px 0 0; }
.sb-head p { margin: 0; color: var(--ink-2); font-size: 15px; }
.group-title {
  font-size: 14px; font-weight: 700; color: var(--ink-2);
  margin: 26px 0 4px; padding-bottom: 6px;
  border-bottom: 1px solid var(--hairline);
}
.sb-card { display: grid; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--hairline); }
.sb-card:last-of-type { border-bottom: none; }
.sb-photo { width: 100%; max-height: 260px; object-fit: cover; border-radius: 12px; display: block; }
.sb-name { margin: 0; font-size: 20px; font-weight: 600; }
.sb-spec { margin: -8px 0 0; color: var(--ink-2); font-size: 14px; }
.field-label { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  appearance: none; border: 1px solid var(--hairline); background: var(--chip);
  color: var(--ink); border-radius: 999px; padding: 9px 16px;
  font: inherit; font-size: 15px; cursor: pointer; min-height: 44px;
}
.chip[aria-pressed="true"] { background: var(--chip-on); border-color: var(--chip-on); color: var(--chip-on-ink); font-weight: 600; }
.text-input {
  width: 100%; font: inherit; font-size: 15px; padding: 11px 14px;
  border: 1px solid var(--hairline); border-radius: 12px; background: #fff; color: var(--ink);
}
.text-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.sb-qty { display: flex; align-items: center; gap: 12px; }
.sb-qty span { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.sb-qty b { min-width: 24px; text-align: center; font-size: 17px; }
.stepper {
  appearance: none; width: 44px; height: 44px; border-radius: 12px;
  border: 1px solid var(--hairline); background: var(--chip); color: var(--ink);
  font-size: 20px; font-weight: 700; cursor: pointer; line-height: 1;
}
.btn {
  appearance: none; border: none; border-radius: 12px; cursor: pointer;
  font: inherit; font-weight: 700; font-size: 16px; padding: 13px 18px;
  min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-decoration: none; text-align: center;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); width: 100%; }
.btn-primary:active { filter: brightness(0.92); }
.btn-ghost { background: none; border: none; color: var(--accent); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; padding: 6px 8px; min-height: 36px; }
.sb-msg { margin: 0; color: var(--ink-2); font-size: 14px; min-height: 1em; }
.sb-lines { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; }
.sb-lines li { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid var(--hairline); padding-bottom: 8px; font-size: 15px; }
.empty { color: var(--ink-2); margin: 0 0 4px; }
.callout {
  background: var(--note-bg); border: 1px solid var(--note-line);
  border-radius: 12px; padding: 12px 14px; margin-top: 14px; font-size: 14px;
}
.callout b { display: block; margin-bottom: 2px; }
.closing { text-align: center; color: var(--ink-2); font-size: 13px; margin-top: 22px; }
.wa-ic { width: 20px; height: 20px; fill: currentColor; }
.wa-float{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:50;display:flex;align-items:center;gap:8px;background:#25d366;color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:12px 18px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.wa-float:active{filter:brightness(.92)}
.wa-float svg{width:24px;height:24px;fill:#fff}
.wrap{padding-bottom:96px}
</style>
</head>

<div class="wrap">

];

const state = products.map(() => ({ size: '', custom: '', plies: '', qty: 1, msg: '' }));
let lines = [];
let nextKey = 1;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function chipRow(options, selected, onPick) {
  const row = el('div', 'chips');
  options.forEach(opt => {
    const b = el('button', 'chip', opt.label);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(selected === opt.value));
    b.addEventListener('click', () => onPick(opt.value));
    row.appendChild(b);
  });
  return row;
}

function renderProducts() {
  const host = document.getElementById('products');
  host.innerHTML = '';
  products.forEach((p, i) => {
    const st = state[i];
    const card = el('section', 'sb-card');

    const img = el('img', 'sb-photo');
    img.src = p.photo; img.alt = p.name; img.loading = 'lazy';
    card.appendChild(img);

    card.appendChild(el('h2', 'sb-name', p.name));
    if (p.spec) card.appendChild(el('p', 'sb-spec', p.spec));

    const wWrap = el('div');
    wWrap.appendChild(el('span', 'field-label', 'العرض'));
    wWrap.appendChild(chipRow(
      [...p.sizes.map(s => ({ value: s, label: s + ' سم' })), { value: CUSTOM, label: 'مقاس خاص' }],
      st.size,
      v => { st.size = v; st.msg = ''; renderProducts(); }
    ));
    card.appendChild(wWrap);

    if (st.size === CUSTOM) {
      const cWrap = el('div');
      cWrap.appendChild(el('span', 'field-label', 'اكتب المقاس اللي عايزه'));
      const input = el('input', 'text-input');
      input.type = 'text';
      input.value = st.custom;
      input.placeholder = 'مثال: ٧٥ سم';
      input.addEventListener('input', () => { st.custom = input.value; });
      cWrap.appendChild(input);
      card.appendChild(cWrap);
      setTimeout(() => input.focus(), 0);
    }

    if (p.plies.length) {
      const pWrap = el('div');
      pWrap.appendChild(el('span', 'field-label', 'عدد التيل'));
      pWrap.appendChild(chipRow(
        p.plies.map(s => ({ value: s, label: s + ' تيلة' })),
        st.plies,
        v => { st.plies = v; st.msg = ''; renderProducts(); }
      ));
      card.appendChild(pWrap);
    }

    const qty = el('div', 'sb-qty');
    qty.appendChild(el('span', null, 'الكمية'));
    const minus = el('button', 'stepper', '-');
    minus.type = 'button';
    minus.addEventListener('click', () => { st.qty = Math.max(1, st.qty - 1); renderProducts(); });
    const plus = el('button', 'stepper', '+');
    plus.type = 'button';
    plus.addEventListener('click', () => { st.qty = st.qty + 1; renderProducts(); });
    qty.appendChild(minus);
    qty.appendChild(el('b', null, String(st.qty)));
    qty.appendChild(plus);
    card.appendChild(qty);

    const add = el('button', 'btn btn-primary', 'أضف للطلب');
    add.type = 'button';
    add.addEventListener('click', () => {
      const width = st.size === CUSTOM ? st.custom.trim() : (st.size ? st.size + ' سم' : '');
      if (!width) { st.msg = 'اختار العرض الأول.'; renderProducts(); return; }
      if (p.plies.length && !st.plies) { st.msg = 'اختار عدد التيل.'; renderProducts(); return; }
      lines.push({
        key: nextKey++,
        name: p.name + (p.spec ? ' ' + p.spec : ''),
        width,
        plies: st.plies ? st.plies + ' تيلة' : '',
        qty: st.qty,
      });
      st.size = ''; st.custom = ''; st.plies = ''; st.qty = 1; st.msg = 'اتضاف للطلب.';
      renderProducts();
      renderOrder();
    });
    card.appendChild(add);

    card.appendChild(el('p', 'sb-msg', st.msg));
    host.appendChild(card);
  });
}

function renderOrder() {
  const list = document.getElementById('lines');
  const empty = document.getElementById('emptyMsg');
  const send = document.getElementById('sendBtn');
  list.innerHTML = '';
  lines.forEach(l => {
    const li = el('li');
    li.appendChild(el('span', null, l.name + ' - ' + l.width + (l.plies ? ' - ' + l.plies : '') + ' - الكمية ' + l.qty));
    const rm = el('button', 'btn-ghost', 'شيل');
    rm.type = 'button';
    rm.addEventListener('click', () => { lines = lines.filter(x => x.key !== l.key); renderOrder(); });
    li.appendChild(rm);
    list.appendChild(li);
  });
  const has = lines.length > 0;
  empty.style.display = has ? 'none' : '';
  send.style.display = has ? 'inline-flex' : 'none';
  if (has) {
    const text = 'السلام عليكم، عايز أطلب:\n' + lines.map((l, i) =>
      (i + 1) + ') ' + l.name + ' - العرض: ' + l.width + (l.plies ? ' - ' + l.plies : '') + ' - الكمية: ' + l.qty
    ).join('\n');
    send.href = 'https://wa.me/' + SHOP_WA + '?text=' + encodeURIComponent(text);
  }
}

renderProducts();
